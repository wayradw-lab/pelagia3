<script>
const $=s=>document.querySelector(s),E=(t,h,c)=>{const e=document.createElement(t);e.innerHTML=h||'';if(c)e.className=c;return e};
const S=[
["Introducing PELAGIA","Shreyas","Welcome everyone. PELAGIA is our project on the ocean and the water cycle. Points: the ocean, marine life, the water cycle, conservation, then a final game. Demo: press Begin. Handoff: Now I will show why we call Earth a blue planet."],
["Our Blue Planet","Shreyas","Points: oceans cover about 71% of Earth's surface; about 97% of Earth's water is in the ocean; five named basins are one connected global ocean. Demo: click each basin. Handoff: Jaffer will take us down into the depths."],
["Journey into the Ocean Depths","Jaffer","Points: light fades with depth; pressure rises; boundaries are approximate. Demo: press Descend, then pick zones. Handoff: Sawhan will introduce the animals that live in these zones."],
["Marine Life and Survival","Sawhan","Points: adaptations like bioluminescence, camouflage and special feeding; every animal has a role in its ecosystem. Demo: open the anglerfish and blue whale. Handoff: Advaith will show how water moves between ocean, air and land."],
["The Water Cycle","Advaith","Points: evaporation, transpiration, condensation, precipitation, runoff, infiltration; water has many pathways; clouds are tiny droplets or ice crystals. Demo: press Play cycle. Handoff: Jeffrey will explain how water moves inside the ocean."],
["Ocean Currents and Movement","Jeffrey","Points: wind drives surface currents; temperature and salinity change density, which drives deep circulation; Coriolis effect bends large currents. Demo: click each factor. Handoff: Rayyan has some amazing discoveries."],
["Amazing Ocean Discoveries","Rayyan","Points: water absorbs red light first so the ocean looks blue; bioluminescence is light made by living things; phytoplankton feed food webs. Demo: open each reveal. Handoff: Jeffrey will explain why the ocean needs our help."],
["Why the Ocean Needs Our Help","Jeffrey","Points: plastic, overfishing, habitat loss, warming; many actions together help; no single action solves everything. Demo: toggle the actions. Handoff: Rayyan will connect everything."],
["Connecting Everything","Rayyan","Points: ocean, air, land, climate and life are linked by moving water and energy. Demo: click a concept to revisit its slide. Handoff: next, our sources."],
["Sources and Scientific Credibility","Rayyan","Points: we used NOAA, NASA and Smithsonian resources; values are approximate; links are for further study. Handoff: now meet the team."],
["The Six Explorers","All six","Together: we explored the ocean, followed the journey of water, and looked at protecting our blue planet. Now we test the class. One of us presses Start."],
["Deep Sea Discovery","All six","One student operates the game. Presenters take turns reading questions aloud, the class votes, then we confirm the answer and read the explanation."]];
const B=[];
B[0]=()=>`<div class="hero"><i class="rays"></i><svg class="wave" viewBox="0 0 1200 200" preserveAspectRatio="none" aria-hidden="true"><path d="M0 80Q150 20 300 80T600 80T900 80T1200 80V200H0z" fill="#126782" opacity=".55"/><path d="M0 120Q150 70 300 120T600 120T900 120T1200 120V200H0z" fill="#0A2638" opacity=".85"/></svg><p class="by">Presented by Shreyas</p><h1>PELAGIA</h1><h2 style="letter-spacing:.3em;font-size:1rem;color:var(--s)">THE OCEAN DISCOVERY EXPERIENCE</h2><p style="font-size:1.4rem;font-style:italic">“Every Drop Has a Story. Every Ocean Holds a Secret.”</p><p>Discover the hidden worlds beneath the waves and the natural processes that connect Earth's water, atmosphere, and living ecosystems.</p><div class="row"><button class="on" onclick="go(1)">Begin presentation</button><button onclick="go(2)">Explore the ocean</button></div></div>`;
const OC={Pacific:"The largest and deepest basin; it holds the Mariana Trench.",Atlantic:"Separates the Americas from Europe and Africa; the Gulf Stream moves warm water across it.",Indian:"Mostly in the Southern Hemisphere; seasonal monsoon winds shape its currents.",Southern:"Surrounds Antarctica; the Antarctic Circumpolar Current links the other basins.",Arctic:"The smallest and shallowest basin; much of it is covered by sea ice."};
B[1]=()=>`<h2>Our Blue Planet</h2><p class="by">Shreyas</p><div class="grid"><div class="g"><div class="stat" data-n="71">≈71%</div>of Earth's surface is covered by ocean.<details><summary>Source</summary>NOAA National Ocean Service. Approximate value.</details></div><div class="g"><div class="stat" data-n="97">≈97%</div>of Earth's water is in the ocean.<details><summary>Source</summary>NOAA / USGS water science. Approximate value.</details></div></div><p>The ocean is one connected global system. We give names to five basins, but water, heat and life move between them. The ocean shapes weather, climate, ecosystems and human life.</p><div class="row" id="oc">${Object.keys(OC).map(k=>`<button>${k}</button>`).join('')}</div><div class="g" id="od">Select a basin.</div>`;
const Z=[["Sunlight Zone (Epipelagic)","0–200 m","#2fa3b8","Enough light for photosynthesis. Phytoplankton live here and support many food webs.","Dolphins, sea turtles, tuna"],["Twilight Zone (Mesopelagic)","200–1,000 m","#126782","Light is very faint, so photosynthesis is generally not possible. Many animals have large eyes or make their own light.","Lanternfish, some squid"],["Midnight Zone (Bathypelagic)","1,000–4,000 m","#0A2638","No sunlight. Cold water and high pressure. Animals use bioluminescence and special feeding strategies.","Anglerfish, giant squid (visits)"],["Abyssal Zone (Abyssopelagic)","4,000–6,000 m","#061521","Dark, cold and food-poor. Marine snow carries organic material down from above.","Sea cucumbers, some fish"],["Hadal Zone","≈6,000–11,000 m","#030D15","Found in the deepest trenches. Pressure is extreme, yet specialized organisms live in some trenches.","Amphipods, snailfish"]];
B[2]=()=>`<h2>Journey into the Ocean Depths</h2><p class="by">Jaffer</p><div class="two"><div><div class="row" id="zb">${Z.map((z,i)=>`<button>${z[0].split(' (')[0]}</button>`).join('')}</div><button class="on" id="ds">▼ Descend</button><div class="g" id="zd" style="margin-top:12px"></div><p style="font-size:.9rem;color:var(--g)">Zone boundaries are approximate. Conditions and species ranges vary by place; animals are not limited to a single zone.</p></div><div id="zv" class="g" style="min-height:360px;padding:0;overflow:hidden;display:flex;flex-direction:column" role="group" aria-label="Depth zones, shallow at top"></div></div>`;
const A=[["Blue whale","Balaenoptera musculus","Open ocean worldwide","Krill","Huge baleen plates filter tiny prey","Controls krill populations; its waste fertilizes surface waters"],["Sea turtle","e.g. green turtle, Chelonia mydas","Tropical and subtropical seas, beaches for nesting","Seagrass, algae, jellyfish (varies by species)","Flippers and a streamlined shell for long migrations","Grazing keeps seagrass beds healthy"],["Bottlenose dolphin","Tursiops truncatus","Coastal and offshore waters","Fish and squid","Echolocation to find prey","Top predator that helps balance fish populations"],["Octopus","e.g. common octopus, Octopus vulgaris","Reefs, seabed and rocky coasts","Crabs, molluscs, fish","Skin that changes colour and texture for camouflage","Predator and prey in reef food webs"],["Lanternfish","Family Myctophidae","Mostly twilight zone, rising at night","Zooplankton","Light-producing organs (bioluminescence)","Move food between deep and shallow waters"],["Anglerfish","Order Lophiiformes","Deep ocean (many species)","Fish and crustaceans","A glowing lure to attract prey in the dark","Ambush predator in deep food webs"],["Giant squid","Architeuthis dux","Deep waters worldwide","Fish and squid","Very large eyes for dim light","Prey for sperm whales; a deep-sea predator"],["Clownfish","e.g. Amphiprion ocellaris","Coral reefs, among sea anemones","Algae and plankton","Mucus coat that lets it live among anemone stings","Lives in a mutual relationship with anemones"]];
B[3]=()=>`<h2>Marine Life and Survival</h2><p class="by">Sawhan</p><p>Choose an animal to see its habitat, diet, adaptation and ecological role.</p><div class="grid">${A.map((a,i)=>`<button data-a="${i}" style="min-height:70px">${a[0]}</button>`).join('')}</div>`;
const W=[["Evaporation","Liquid water gains energy (mostly from the Sun) and enters the air as water vapour."],["Transpiration","Plants take up water through roots and release water vapour through their leaves."],["Condensation","Rising air cools, so water vapour condenses into tiny droplets or ice crystals. Clouds are made of these, not of visible vapour."],["Precipitation","Water returns to the surface as rain, snow or other forms, depending on temperature."],["Runoff","Water flows over land into streams, rivers and lakes, and often back to the ocean."],["Infiltration and groundwater","Water soaks into soil and can recharge groundwater, which may later feed springs and rivers."]];
const dots=(x,y,n,c,w=60)=>Array.from({length:n},(_,i)=>`<circle class="${c}" cx="${x+i*w/n}" cy="${y}" r="4" fill="#B8E5DE" style="animation-delay:${i*.4}s"/>`).join('');
B[4]=()=>`<h2>The Water Cycle</h2><p class="by">Advaith</p><div class="two"><div><svg id="ws" viewBox="0 0 600 300" role="img" aria-label="Water cycle landscape with ocean, mountain, plants, clouds and groundwater"><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#B8E5DE"/></marker></defs><rect width="600" height="300" fill="#0A2638"/><circle cx="540" cy="40" r="24" fill="#f5c76b"/><polygon points="330,200 440,70 560,200" fill="#5d7b88"/><polygon points="440,70 470,105 420,105" fill="#fff"/><rect y="200" x="0" width="600" height="100" fill="#3a2f27"/><rect y="200" width="300" height="50" fill="#126782"/><rect y="262" x="40" width="520" height="30" fill="#126782" opacity=".6"/><text x="60" y="283" fill="#fff" font-size="12">groundwater</text><text x="60" y="225" fill="#fff" font-size="13">ocean</text><rect x="360" y="170" width="6" height="30" fill="#6b4"/><circle cx="363" cy="165" r="16" fill="#3a9a4a"/><g fill="#dfeaec"><ellipse cx="150" cy="60" rx="50" ry="20"/><ellipse cx="180" cy="48" rx="35" ry="18"/></g>
<g class="pg" id="p0"><path class="fl" d="M110 195C110 150 120 115 140 85" fill="none" stroke="#B8E5DE" stroke-width="4" marker-end="url(#ah)"/><path class="fl" d="M210 195C210 150 195 115 170 85" fill="none" stroke="#B8E5DE" stroke-width="4" marker-end="url(#ah)"/><text x="40" y="150" fill="#fff" font-size="13">evaporation</text></g><g class="pg" id="p1"><path class="fl" d="M363 146C363 110 290 90 215 70" fill="none" stroke="#B8E5DE" stroke-width="4" marker-end="url(#ah)"/><text x="372" y="140" fill="#fff" font-size="13">transpiration</text></g><g class="pg" id="p2"><ellipse cx="150" cy="60" rx="64" ry="28" fill="none" stroke="#45C6C0" stroke-width="3"/><text x="75" y="22" fill="#fff" font-size="13">condensation</text></g><g class="pg" id="p3"><path class="fl" d="M105 90V190" fill="none" stroke="#B8E5DE" stroke-width="4" marker-end="url(#ah)"/><path class="fl" d="M150 90V190" fill="none" stroke="#B8E5DE" stroke-width="4" marker-end="url(#ah)"/><path class="fl" d="M195 90V190" fill="none" stroke="#B8E5DE" stroke-width="4" marker-end="url(#ah)"/><text x="210" y="140" fill="#fff" font-size="13">precipitation</text></g><g class="pg" id="p4"><path class="fl" d="M440 110L400 200L300 215" fill="none" stroke="#B8E5DE" stroke-width="4" marker-end="url(#ah)"/><text x="455" y="170" fill="#fff" font-size="13">runoff</text></g><g class="pg" id="p5"><path class="fl" d="M400 205V255" fill="none" stroke="#B8E5DE" stroke-width="4" marker-end="url(#ah)"/><path class="fl" d="M340 277H110" fill="none" stroke="#B8E5DE" stroke-width="4" marker-end="url(#ah)"/><text x="415" y="240" fill="#fff" font-size="13">infiltration</text></g></svg>
<div class="row"><button id="wp" class="on">Pause</button><button id="wr">Reset</button><button id="wa">◀ Previous process</button><button id="wb">Next process ▶</button></div></div><div><div class="row" id="wl">${W.map((w,i)=>`<button>${w[0].split(' ')[0]}</button>`).join('')}</div><div class="g" id="wd" aria-live="polite"></div><p style="font-size:.9rem;color:var(--g)">Water takes many paths. It can also stay stored for long times in oceans, ice, soil, lakes, groundwater and air.</p></div></div>`;
const C={Wind:["Wind pushes on the surface and drives many surface currents. Earth's rotation (the Coriolis effect) bends large currents.","→ → →"],Temperature:["Warm water is less dense and stays near the top. Cold water is denser and sinks.","↑ warm   ↓ cold"],Salinity:["Saltier water is denser. Evaporation and sea-ice formation raise salinity; rain and river water lower it.","≈ salty ↓"],Density:["Temperature and salinity set density. Dense water sinks and helps drive deep-ocean circulation.","↓ ↓ ↓"]};
B[5]=()=>`<h2>Ocean Currents and Movement</h2><p class="by">Jeffrey</p><div class="two"><div><div class="row" id="cl">${Object.keys(C).map(k=>`<button>${k}</button>`).join('')}</div><div class="g" id="cd" aria-live="polite"></div></div><div><svg viewBox="0 0 400 220" role="img" aria-label="Simplified current model: warm surface flow driven by wind and cold dense deep return flow"><defs><marker id="ah2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#F2F7F7"/></marker></defs><rect width="400" height="220" fill="#0A2638"/><rect y="140" width="400" height="80" fill="#061521"/><path class="fl" d="M30 45H330Q372 45 372 80T330 115H70" fill="none" stroke="#F4A261" stroke-width="4" marker-end="url(#ah2)"/><path class="fl" d="M370 150V195H60" fill="none" stroke="#45C6C0" stroke-width="4" marker-end="url(#ah2)"/><text x="30" y="30" fill="#F2F7F7" font-size="13">Orange: surface current (wind-driven)</text><text x="30" y="212" fill="#F2F7F7" font-size="13">Teal: deep flow (density-driven)</text><text id="ca" class="sw" x="120" y="100" fill="#B8E5DE" font-size="24"></text></svg><p style="font-size:.85rem;color:var(--g)">Simplified educational model, not live ocean data.</p></div></div><p>Surface currents (wind), deep circulation (density), tides (gravity) and waves (energy) are different processes.</p><p>Waves move energy through water, while the water itself mostly moves in small circles. Tides come mainly from the Moon's gravity, with a smaller contribution from the Sun.</p>`;
const D=[["Why is the ocean blue?","Water absorbs red light more strongly than blue, so blue light is scattered back to our eyes. It is not just a reflection of the sky."],["Why does red disappear first?","Red wavelengths are absorbed within the first few metres, so deeper water looks blue and then dark."],["What is bioluminescence?","Light made by living organisms through chemical reactions. Not every deep-sea species does it."],["Why does pressure rise with depth?","Deeper water has more water above it, so the weight pressing down increases."],["Why do phytoplankton matter?","They photosynthesize and form the base of many marine food webs."],["What is marine snow?","Falling bits of dead organisms and waste that carry organic material to deeper water."],["How does the ocean affect climate?","It stores and transports heat and exchanges water and gases with the atmosphere."],["How is water cycle linked to the ocean?","Most evaporation comes from the ocean, and much precipitation and runoff returns to it."]];
